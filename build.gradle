plugins {
    id 'java'
}

group = 'com.mineplus'
version = '1.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
}

dependencies {
    // Spigot stubs only, deliberately: no paper-api on this classpath. A
    // Paper-only method (Entity#getPitch, Entity#getX, Mob#getPathfinder,
    // Bukkit#getGlobalRegionScheduler, Paper's PlayerStopUsingItemEvent) then
    // fails the build instead of linking silently and throwing
    // NoSuchMethodError on a Spigot server at runtime. Every Paper/Folia seam
    // is reflective and lives behind its own probe.
    compileOnly files(
            "libs/spigot-api-1.21.1.jar",
            "libs/adventure-api-4.17.0.jar",
            "libs/examination-api-1.3.0.jar",
            "libs/adventure-text-minimessage-4.17.0.jar",
            "libs/adventure-key-4.17.0.jar",
            "libs/adventure-platform-api-4.3.0.jar",
            "libs/bungeecord-chat-1.20.jar",
            "libs/joml-1.10.8.jar",
            "libs/gson-2.13.2.jar",
            "libs/guava.jar",
            "libs/item-nbt-api-plugin-2.15.6.jar",
            "libs/sqlite-jdbc-3.45.1.0.jar",
            "libs/slf4j-api-2.0.13.jar",
            "libs/slf4j-simple-2.0.13.jar",
            "libs/HikariCP-5.1.0.jar",
            "libs/fastutil-8.5.14.jar"
    )
}

// The jars above are compileOnly so nothing is bundled into the plugin jar, but
// the test source set is a separate classpath and needs them too.
configurations {
    testImplementation.extendsFrom compileOnly
}

// Plain-Java test runners (no JUnit): one JavaExec per runner main.
def testRunnerMains = [
        'com.mineplus.test.CustomMobPipelineTest',
        'com.mineplus.test.CompatVersionTest',
        'com.mineplus.test.SchedulerCompatTest',
        'com.mineplus.test.AttributeSeamTest',
        'com.mineplus.test.ApiShapeGuardTest',
        'com.mineplus.test.WanderGuardDecisionTest',
        'com.mineplus.test.MolangEvaluatorTest',
        'com.mineplus.test.FormationTest',
        'com.mineplus.test.AiTargetingTest',
        'com.mineplus.test.EnergyGridTest',
        'com.mineplus.test.KineticGridTest',
        'com.mineplus.test.NetworkRoutingTest',
        'com.mineplus.test.MinigameStateTest',
        'com.mineplus.test.GameMapTest',
        'com.mineplus.test.MegaPlanSlicesTest',
        'com.mineplus.test.PersistenceTransportTest',
        'com.mineplus.test.RedisTransportTest',
        'com.mineplus.test.AdapterPersistenceTest',
        'com.mineplus.test.BossReloadTest',
        'com.mineplus.test.AssetPipelineTest',
]

tasks.register('testRunners') {
    group = 'verification'
    description = 'Runs the plain-Java test runner mains.'
    dependsOn tasks.named('testClasses')
}

def resultsDir = layout.buildDirectory.dir('test-results/test')

testRunnerMains.each { main ->
    def taskName = 'testRun' + main.tokenize('.').last()
    tasks.register(taskName, JavaExec) {
        classpath = sourceSets.test.runtimeClasspath
        mainClass = main
        ignoreExitValue = true
        doFirst {
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }
        doLast {
            def out = standardOutput.toString()
            def err = errorOutput.toString()
            def failed = executionResult.get().exitValue != 0
            def suite = main.tokenize('.').last()
            def dir = resultsDir.get().asFile
            dir.mkdirs()
            new File(dir, "${suite}.xml").text = """<?xml version="1.0" encoding="UTF-8"?>
<testsuite name="${main}" tests="1" failures="${failed ? 1 : 0}" errors="0" skipped="0">
  <testcase name="${suite}" classname="${main}" time="0">
${failed ? "    <failure message=\"runner exited non-zero\" type=\"RunnerFailure\"><![CDATA[${out}${err}]]></failure>\n" : ''}  </testcase>
  <system-out><![CDATA[${out}]]></system-out>
  <system-err><![CDATA[${err}]]></system-err>
</testsuite>
"""
            if (failed) {
                throw new GradleException("${taskName} failed\n${out}${err}")
            }
        }
    }
    tasks.named('testRunners') {
        dependsOn taskName
    }
}

tasks.named('check') {
    dependsOn 'testRunners'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    inputs.property("version", project.version)
    filteringCharset = 'UTF-8'

    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}
