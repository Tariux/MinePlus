name: MineplusFun
version: ${version}
main: com.mineplus.fun.MineplusFunPlugin
api-version: '1.21'
author: Tariux
description: Reference module for Mineplus - the Juicer, the Cannon, the Gear, and the texel-baked Wine Tasting Flight.
website: https://github.com/Tariux/MinePlus

# Hard dependency: the Core engine must be present and enabled first.
depend: [Mineplus]

# Commands (/juicer, /cannon, /gear, /wine) are registered dynamically at enable time via
# context.moduleSupport().registerCommand(...) - no plugin.yml entries needed.

permissions:
  mineplusfun.admin.juicer:
    description: Allows using Juicer controls
    default: op
  mineplusfun.admin.cannon:
    description: Allows using Cannon controls
    default: op
  mineplusfun.admin.gear:
    description: Allows using Gear controls
    default: op
  mineplusfun.admin.wine:
    description: Allows using Wine Bottle and tasting flight controls
    default: op
