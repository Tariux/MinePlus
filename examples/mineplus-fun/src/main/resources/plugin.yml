name: MineplusFun
version: ${version}
main: com.mineplus.fun.MineplusFunPlugin
api-version: '1.21'
author: Tariux

# Hard dependency: the Core engine must be present and enabled first.
depend: [Mineplus]

commands:
  juicer:
    description: Juicer machine controls (MineplusFun module)
    usage: /juicer <place|remove|upgrade|give>
  cannon:
    description: Cannon machine controls (MineplusFun module)
    usage: /cannon <place|remove|upgrade>

permissions:
  mineplusfun.admin.juicer:
    description: Allows using Juicer controls
    default: op
  mineplusfun.admin.cannon:
    description: Allows using Cannon controls
    default: op
