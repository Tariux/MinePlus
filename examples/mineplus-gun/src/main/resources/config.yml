    ballistics: { damage: 8.5, headshot-multiplier: 2.0, velocity: 3.6, gravity: 0.025, drag: 0.012, range: 110, spread-degrees: 0.8, falloff-start: 45, falloff-per-block: 0.025 }
    fire: { mode: SEMI, rpm: 130 }
