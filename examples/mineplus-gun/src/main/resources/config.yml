# MineplusGun — the final gun system.
#
# One weapon entry = one gun. Presentation is discovered, not configured: the
# module ships a folder per gun under defaults/guns/<id>/ inside its jar, and
# every model file name says what the frame is. On first enable the files are
# mirrored into the Core's pack staging area
# (plugins/Mineplus/pack/mineplusgun/models/item/<id>/), the frame classifier
# reads the installed folder, and the gun gets its animation. Adding a gun is
# dropping a folder in the jar and a weapon entry here; no code, no frame list.
#
# Recognised model suffixes (after "<id>_"):
#   idle | rest | base                 resting pose
#   primed | loaded | ready            loaded pose (shown while rounds remain)
#   loading_N | reload_N | load_N      reload frames, sorted numerically
#   fire_N | shoot_N | shot_N          shot frames, sorted numerically
#   scope_in_N | scope_hold | scope_out_N   scope poses
#   cycle_N | bolt_N | pump_N | rack_N action cycle after a shot
#   equip_N | draw_N | raise_N         draw pose
# A folder may instead ship ONE "<id>.bbmodel": every Blockbench clip in it is
# baked into the frames above when the module installs (a clip named *fire*
# becomes fire_N, *lever_cycle* becomes cycle_N, *zoom* becomes scope_in_N plus
# the scope_hold/scope_out_N poses, *reload* or *break_load* becomes loading_N
# and *close* — the snap-shut half of a break action — becomes cycle_N). An
# `idle` clip is never baked — a held item cannot be rewritten per frame — and a
# clip whose name says nothing recognisable is reported, not guessed.
# Everything is optional: a gun with only <id>_idle fires, reloads and scopes
# without ever changing pose. A weapon with no models at all still works on its
# vanilla carrier. An explicit `frames:` block (same schema as Core content)
# overrides discovery for that weapon.
#
# Controls
#   RIGHT-CLICK   fire (hold for automatic fire)
#   LEFT-CLICK    scope on/off; otherwise fully swallowed — never punches,
#                 mines or interacts. With settings.scope-gui on, scoping also
#                 opens a reticle overlay: the sight line is the gap in the
#                 black frame, clicking it fires a scoped round, and closing the
#                 overlay (Esc, E, or any other screen) unscopes. Hip-fire on
#                 the right button keeps working the moment you leave the scope.
#   F (swap)      reload; an empty gun reloads itself shortly after the last shot
#   Minecraft sends no event for an arbitrary key, so bind the reload key by
#   rebinding "Swap Item With Offhand" to F; the gun consumes the swap so the
#   item never leaves the hand.
#
# Reload economy: one round consumes `ammo.items-per-round` items of
# `ammo.material` from the player's inventory. A supply too small for one whole
# round means no reload, and the HUD counts the reserve in rounds.
#
# The round budget (BALLISTICS.MAX_ACTIVE_ROUNDS) and particle budgets
# (PARTICLE_FX) are Core engine settings in plugins/Mineplus/settings.mp.yml:
# they meter every module on the server, so a plugin cannot silently double the
# server's per-tick cost. Per-weapon ballistics live below.
#
# Sound events are supplied by this module's own sounds.json
# (mineplusgun:pistol_shot, shotgun_shot, rifle_shot, battle_rifle_shot,
# reload_begin, reload_mid, reload_done, empty). An unknown custom event falls
# back to a vanilla sound instead of silencing the weapon.
#
# A weapon's `animation:` block has two spellings per role (reload, cycle, fire,
# scope-in, scope-hold, scope-out, equip): a STRING renames that role's clip —
# the clip baked from a Blockbench clip called `lever_cycle` is a `cycle` — and a
# NUMBER is the authored clip length in SECONDS, which is how long the pose is
# held on screen. The reload pose and the action-cycle pose take their length
# from `ammo.reload-ticks` and `fire.cycle-ticks` instead, because those numbers
# also meter the weapon.
#
# `backing-material` is the vanilla item the gun is built on. Keep it UNIQUE
# per weapon: on 1.21.4+ the pack plays each clip on the item's own cooldown
# clock, and the client keeps that cooldown per material — two guns sharing a
# material would animate each other. A gun that also has no model still works
# on its carrier.
#
# API: other plugins can veto or react to the flow through
#   com.mineplus.gun.event.WeaponFireEvent   (cancellable, before a round is spent)
#   com.mineplus.gun.event.WeaponReloadEvent (cancellable, before a reload starts)
#   com.mineplus.gun.event.WeaponHitEvent    (cancellable, before round damage lands)

settings:
  language: en
  scope-gui: true              # the scope trigger opens a reticle overlay;
                               # clicking the sight line fires a scoped round
  hud:
    mode: ACTIONBAR            # ACTIONBAR | BOSSBAR | OFF
    # One quiet line: loaded/reserve. `{mag}` is tinted white, red when low and
    # grey while loading; `{weapon}` and `{mode}` are available for a custom
    # template. RELOADING/SCOPE are appended automatically while true.
    template: "{mag}&8/&7{reserve}"
    low-ammo-threshold: 2
  disabled-worlds: []          # gameplay (firing/shop use) disabled in these worlds
  pvp-only: false              # only damage players, never other living entities

ammo:
  material: GOLD_NUGGET
  items-per-round: 1

economy:
  mode: VAULT                  # VAULT | FREE
  price-multiplier: 1.0
  price-scale: 1               # 0 = integers, 1 = tenths, 2 = hundredths, 3 = thousandths

shop:
  title: "Frontier Gunsmith"
  rows: 6
  admin-bypass-payment: true   # ops (with the bypass permission) are never charged

weapons:

  # --- Pistol ---------------------------------------------------------------
  pistol:
