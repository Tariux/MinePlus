    ammo: { magazine: 5, reload-ticks: 65 }
    ballistics: { damage: 16.0, headshot-multiplier: 2.2, velocity: 4.2, gravity: 0.02, drag: 0.008, penetration: 1, range: 160, spread-degrees: 0.45, falloff-start: 70, falloff-per-block: 0.015 }
    fire: { mode: BOLT, rpm: 47 }
    fx: { muzzle: SMOKE, flash: FLAME, smoke: LARGE_SMOKE, spark: SMALL_FLAME, tracer: CRIT, impact: CRIT, impact-smoke: CLOUD, sound-fire: "mineplusgun:heavy" }

