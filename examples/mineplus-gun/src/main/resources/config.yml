# MineplusGun — module configuration.
#
# Every weapon below is data-driven: add an entry to add a weapon, never code.
# The `model` key is the installed bbmodel stem under the Core's models folder
# (models/gun/<stem>.bbmodel). `backing-material` is only the carrier item the
# additive item_model replaces; with PACK.ENABLED: false the weapon degrades to
# that vanilla material. SPYGLASS is a usable, non-projectile carrier: hold and
# release are observable without PacketEvents (accepting the scope zoom), which
# is why automatic weapons use it.

settings:
  language: en
  hud:
    mode: ACTIONBAR            # ACTIONBAR | BOSSBAR | OFF
    template: "&e{weapon} &7| &f{mag}&7/&f{reserve} &7| &b{mode}"
    low-ammo-threshold: 3
  disabled-worlds: []          # gameplay (firing/shop use) disabled in these worlds
  pvp-only: false              # only damage players, never other living entities
  block-damage: true           # grenade terrain damage

ballistics:
  max-active-bullets: 96       # bullets simulated per tick; overflow resolves instantly
  max-particles-per-tick: 240

economy:
  mode: VAULT                  # VAULT | FREE
  price-multiplier: 1.0
  price-scale: 1               # 0 = integers, 1 = tenths, 2 = hundredths, 3 = thousandths

shop:
  title: "Weapon Store"
  rows: 6
  admin-bypass-payment: true   # ops (with the bypass permission) are never charged

