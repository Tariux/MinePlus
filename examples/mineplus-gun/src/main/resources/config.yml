# MineplusGun — Western module configuration.
#
# The arsenal is the imported Western gunpacks: two pack-1 guns (pistol and
# rifle), two pack-2 guns (lever rifle and coach shotgun) and the five
# musketmod flintlocks (pistol, musket, bayoneted, scoped, blunderbuss).
# Every weapon is data-driven: add an entry to add a weapon, never code.
#
# Presentation axis (`frames:`): the weapon renders through the Core's
# framed-item infrastructure. Stems resolve to the raw pack models the module
# installs from defaults/frames/<weapon-id>/<stem>.json; state 0 is idle,
# 1..N play the reload animation, N+1 is the loaded state (the `loaded`
# stem) and N+2 is the fire state (the `fire` stem) — the pose the weapon
# shows for a few ticks after it shoots. `texture` names the per-weapon
# texture file the frame models sample.
#
# `backing-material` is the vanilla carrier item the item model replaces.
# It must be a NEUTRAL carrier (no vanilla use action): a bow, a crossbow or
# food would put the client into its own "using item" state, the client would
# then stop sending further use packets, and the Core would read the press as
# a single shot instead of a hold. A neutral carrier (ingot, stick) keeps the
# vanilla interaction inert, so the Core owns the whole trigger stream. The
# Core resolves that stream once for every module: a modern client answers a
# click on a block with two packets (use-on-block, then use-in-hand) and the
# Core folds them into one press — a weapon never fires twice for one click.
# With PACK.ENABLED: false (or a client that has not applied the pack) the
# weapon degrades to the bare carrier.
#
# `aim.scope: true` marks a weapon as scoped: while the trigger is held its
# spread is multiplied by `aim.spread-multiplier` and the HUD shows SCOPE.
#
# Controls: RIGHT-click is the only action — firearms fire (hold for AUTO),
# a scoped weapon scopes while held, melee swings. LEFT-click is inert.
# Swapping hands reloads, drawing the rounds from the gold-nugget supply
# (see `ammo` below).
#
# Sandbox (per shot): damage is per pellet; pellets x damage grow with
# `fire.pellets`. Flintlocks take one shot and a long, exposed reload;
# repeaters trade capacity for steady aim; scatter guns only pay off close.
#
# Effects (`fx:`): the Core emits the whole shot effect from one profile:
# `flash` the bright muzzle burst, `sparks` the burning embers the shot
# throws off, `smoke` the powder smoke that hangs at the barrel, `muzzle` the
# slow cloud that lingers, `tracer` the streak of the round in flight and
# `impact`/`impact-smoke` the hit confirmation. Every name is a vanilla
# particle; an unknown one degrades to the default instead of silencing the
# weapon.

settings:
  language: en
  hud:
    mode: ACTIONBAR            # ACTIONBAR | BOSSBAR | OFF
    template: "&e{weapon} &7| &f{mag}&7/&f{reserve} &7| &b{mode}"
    low-ammo-threshold: 2
  disabled-worlds: []          # gameplay (firing/shop use) disabled in these worlds
  pvp-only: false              # only damage players, never other living entities

# The reload economy: one reload round consumes `items-per-round` items of
# `material` from the player's inventory (gold nuggets by default — pan for
# gold, hoard your shots). A supply too small for one whole round means no
# reload, and the HUD counts the reserve in rounds, like the magazine.
ammo:
  material: GOLD_NUGGET
  items-per-round: 1

# The round budget (BALLISTICS.MAX_ACTIVE_ROUNDS) and the particle budgets
# (PARTICLE_FX) are Core engine settings in plugins/Mineplus/settings.mp.yml:
# they meter every module on the server, so a plugin cannot silently double the
# server's per-tick cost. Per-weapon ballistics (damage, velocity, spread…) are
# configured in each weapon's own `ballistics:` section below.

economy:
  mode: VAULT                  # VAULT | FREE
  price-multiplier: 1.0
  price-scale: 1               # 0 = integers, 1 = tenths, 2 = hundredths, 3 = thousandths

shop:
  title: "Frontier Gunsmith"
  rows: 6
  admin-bypass-payment: true   # ops (with the bypass permission) are never charged

weapons:
  # --- western_1 pack ------------------------------------------------------
  western_pistol:
    display-name: "&fWestern Pistol"
    type: PISTOL
    backing-material: IRON_INGOT
    price: 500
    frames:
      idle: idle
      reload: [reload0, reload1, reload2, reload3, reload4]
      loaded: loaded
      fire: fire
      texture: western_pistol.png
    ammo: { magazine: 6, reload-ticks: 50 }
    ballistics: { damage: 10.0, headshot-multiplier: 2.0, velocity: 3.2, gravity: 0.03, drag: 0.01, range: 70, spread-degrees: 1.2, falloff-start: 30, falloff-per-block: 0.03 }
    fire: { mode: SEMI, rpm: 280 }
    fx: { muzzle: SMOKE, flash: FLAME, smoke: SMOKE, spark: SMALL_FLAME, tracer: CRIT, impact: CRIT, impact-smoke: CLOUD, sound-fire: "mineplusgun:shot" }

  western_rifle:
    display-name: "&fWestern Rifle"
    type: RIFLE
    backing-material: IRON_INGOT
    price: 2600
