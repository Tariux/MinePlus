name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: ./gradlew compileJava --no-daemon

      # Plain-Java runners, no JUnit: a non-zero exit fails the step.
      - name: Test runners
        run: ./gradlew testRunners --no-daemon

      - name: Ship the jar
        run: ./gradlew jar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mineplus-jar
          path: build/libs/*.jar
