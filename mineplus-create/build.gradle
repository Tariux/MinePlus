plugins {
    id 'java'
}

group = 'com.mineplus'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
}

dependencies {
    // The Core engine jar from the root project (compileJava depends on ':jar').
    compileOnly files("../build/libs/mineplus-1.3.0.jar")

    // Core's compile-time dependencies are also required here so the Core API
    // signatures resolve. At runtime the server provides paper/spigot.
    compileOnly files(
            "../libs/spigot-api-1.21.1.jar",
            "../libs/paper-api-1.21.jar",
            "../libs/adventure-api-4.17.0.jar",
            "../libs/adventure-text-minimessage-4.17.0.jar",
            "../libs/adventure-key-4.17.0.jar",
            "../libs/adventure-platform-api-4.3.0.jar",
            "../libs/bungeecord-chat-1.20.jar",
            "../libs/joml-1.10.8.jar",
            "../libs/gson-2.13.2.jar",
            "../libs/item-nbt-api-plugin-2.15.6.jar",
            "../libs/sqlite-jdbc-3.45.1.0.jar",
            "../libs/guava.jar",
            "../libs/fastutil-8.5.14.jar",
            "../libs/examination-api-1.3.0.jar"
    )
}

// Plain-Java test runners (no JUnit): one JavaExec per runner main — same
// pattern as the Core build.
def testRunnerMains = [
        'com.mineplus.create.test.RotationalNetworkTest',
        'com.mineplus.create.test.CreatePhase2Test',
        'com.mineplus.create.test.CreatePhase3Test',
]

tasks.register('testRunners') {
    group = 'verification'
    description = 'Runs the plain-Java test runner mains.'
    dependsOn tasks.named('testClasses')
}

testRunnerMains.each { main ->
    def taskName = 'testRun' + main.tokenize('.').last()
    tasks.register(taskName, JavaExec) {
        classpath = sourceSets.test.runtimeClasspath
        mainClass = main
    }
    tasks.named('testRunners') {
        dependsOn taskName
    }
}

tasks.named('check') {
    dependsOn 'testRunners'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn ':jar'
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    inputs.property("version", project.version)
    filteringCharset = 'UTF-8'

    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}
