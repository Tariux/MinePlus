name: Mineplus
version: ${version}
main: com.mineplus.MineplusPlugin
api-version: '1.21'
author: Tariux
description: Data-driven machines and custom structures for Minecraft, rendered on completely vanilla clients.
website: https://github.com/Tariux/MinePlus

commands:
  mineplus:
    description: Mineplus Core runtime administration command
    usage: /mineplus <status|reload|model>

permissions:
  mineplus.admin.status:
    description: Allows reading Mineplus Core runtime status
    default: op
  mineplus.admin.reload:
    description: Allows reloading Mineplus Core configs and models
    default: op
  mineplus.admin.model:
    description: Allows administrating active Mineplus Core model instances
    default: op
