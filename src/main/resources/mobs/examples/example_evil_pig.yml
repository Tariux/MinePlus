# Example custom-mob definition for the Mineplus core.
#
# This file lives in mobs/examples/ so the loader does not pick it up. Copy it
# to plugins/Mineplus/mobs/ (top level), drop the referenced texture next to it
# (also in mobs/) and run /mineplus mob reload.
#
# id defaults to the file name; a bare id becomes mineplus:<id>.
id: example_evil_pig

# Required. Any EntityType name works (PIG, VILLAGER, ZOMBIE, ...).
base-entity: PIG

# Who owns the mob's mind.
#   core (default) — the Core clears the base type's vanilla goals and steers
#                    the mob through its behavior profile; a definition with no
#                    profile just stands still.
#   vanilla        — the game engine runs it: the mob paths, walks, swings,
#                    recoils and dies exactly like its base type, with no plugin
#                    scan cost and client-smooth motion. Pick a base whose own AI
#                    already does the job (ZOMBIE hunts players, IRON_GOLEM
#                    guards). See example_soldier_vanilla_ai.yml.
# ai: core

display-name: "Evil Pig"
show-name: true

# Optional attribute overrides (only the ones you set are applied).
attributes:
  max-health: 12.0
  movement-speed: 0.28

# Presentation. Types:
#   retexture_vanilla — the vanilla entity keeps its geometry, only its texture
#                       is swapped (needs a 1.21.5+ server; older runtimes
#                       keep the vanilla look and log it). The texture must
#                       match the vanilla layout (a pig is 64x32).
#   bbmodel           — a Blockbench .bbmodel rendered as a per-bone display
#                       rig with its own clips ('file' + usually 'texture').
#   java_json         — a Java block/item model JSON as one static display.
#   none              — vanilla look, pack assets still published.
render:
  type: retexture_vanilla
  texture: evil_pig.png
  # file: model.bbmodel
  # scale: 1.0
  # yaw-offset: 0           # 180 when the model was authored backwards
  # fallback: base_entity   # or generic_cube
  #
  # How a rig that covers the vanilla silhouette reacts to damage:
  #   particles (default) — a crit burst on the mob each hit
  #   flash             — the base entity is revealed for a few ticks instead
  #   none              — no extra feedback (the base still flashes when visible)
  # hurt-feedback: particles
  #
  # Ground shadow plate under the rig: true (default, sized from the hitbox),
  # a radius in blocks, or false/none to remove it.
  # shadow: true

# Optional hitbox override (blocks, feet-anchored). Applied through
# Entity#setSize where the server exposes it; elsewhere the base type's own box
# stays in force and the loader logs nothing about it.
# hitbox:
#   width: 0.6
#   height: 1.9

# Optional: hang a vanilla material or pack item id on a rig bone.
# hand-items:
#   weapon_r: IRON_SWORD

# Optional: state -> clip aliases for the rig animator.
# animations:
#   attack: animation.smash
